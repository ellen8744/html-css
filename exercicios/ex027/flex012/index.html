<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
          background-color: lightpink;

          display: flex;
          flex-flow: row nowrap;
          
          
        }
        div.item {
           background-color: darkorchid;
        
           border: 1px solid black;
           text-align: center;
           flex-basis: 200px;

          
        }
        div#cxA{
     /* flex-shrink: 0;
        flex-grow: 1;
          flex-basis: 200px;*/
          flex: 1 0 200px;
        }
        div#cxB{
       /* flex-shrink: 1;
        flex-grow: 1;
          flex-basis: 200px;*/
          flex: 1 1 150px;
        }
        div#cxC{
       /* flex-shrink: 1;
        flex-grow: 0;
          flex-basis: 200px;*/
          flex: 1 0 auto;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="cxA">A</div>
         <div class="cxB">B</div>
          <div class="cxC">C</div>
          
    </div>
</body>
</html>
